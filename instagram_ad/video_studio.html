<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estúdio de Animações & Gravação de Vídeos Instagram - Roadster Dash 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background:#0a0b10; color:#fff; width:100vw; height:100vh; overflow:hidden; display:flex; align-items:center; justify-content:center; }
        
        /* Layout Split: Preview 9:16 Central + Painel de Direção à Direita */
        #studio-container { display:flex; width:100%; height:100%; align-items:center; justify-content:center; gap:24px; padding:20px; }
        
        /* Moldura Smartphone 9:16 Instagram Reels */
        #phone-frame {
            position:relative;
            width:390px;
            height:800px;
            border-radius:40px;
            background:#000;
            overflow:hidden;
            box-shadow:0 20px 60px rgba(0,0,0,0.85), 0 0 0 8px #1f2330;
            flex-shrink:0;
        }

        #studio-canvas { width:100%; height:100%; display:block; }

        /* Overlays do Instagram Stories/Reels */
        .reel-overlay { position:absolute; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:18px; z-index:10; }
        
        .reel-top-bar { display:flex; justify-content:space-between; align-items:center; }
        .reel-author { display:flex; align-items:center; gap:8px; }
        .reel-avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg, #f09433, #dc2743, #bc1888); padding:2px; display:flex; align-items:center; justify-content:center; }
        .reel-avatar-in { width:100%; height:100%; border-radius:50%; background:#111; display:flex; align-items:center; justify-content:center; font-size:1.1rem; }
        .reel-name { font-size:0.85rem; font-weight:800; text-shadow:0 2px 4px rgba(0,0,0,0.8); }
        .reel-badge { font-size:0.68rem; opacity:0.85; }

        /* Gancho / Título Chamativo do Vídeo */
        .reel-hook-card {
            align-self:center;
            margin-top:20px;
            background:rgba(0,0,0,0.7);
            backdrop-filter:blur(10px);
            border:2px solid #ffd700;
            padding:10px 20px;
            border-radius:24px;
            text-align:center;
            box-shadow:0 6px 25px rgba(255,215,0,0.4);
            animation:pulseHook 1.8s infinite ease-in-out;
        }
        .reel-hook-title { font-size:1.05rem; font-weight:900; color:#ffd700; letter-spacing:0.5px; }
        .reel-hook-sub { font-size:0.75rem; color:#fff; opacity:0.9; margin-top:2px; }

        @keyframes pulseHook {
            0%, 100% { transform:scale(1); }
            50% { transform:scale(1.04); }
        }

        /* Banner CTA Inferior do Instagram */
        .reel-bottom-cta { display:flex; flex-direction:column; gap:10px; align-items:center; }
        .cta-pill {
            width:100%;
            padding:14px;
            border-radius:28px;
            background:linear-gradient(90deg, #ff0055, #ff5500, #ffaa00);
            text-align:center;
            font-size:1rem;
            font-weight:900;
            color:#fff;
            letter-spacing:0.5px;
            box-shadow:0 6px 25px rgba(255,85,0,0.6);
        }
        .cta-caption { font-size:0.72rem; opacity:0.85; text-shadow:0 1px 3px rgba(0,0,0,0.9); }

        /* Indicador de Gravação ao Vivo */
        #rec-indicator {
            position:absolute;
            top:18px;
            right:18px;
            background:rgba(220, 20, 60, 0.9);
            padding:5px 12px;
            border-radius:14px;
            font-size:0.75rem;
            font-weight:800;
            display:none;
            align-items:center;
            gap:6px;
            z-index:20;
            animation:blinkRec 1s infinite;
        }
        @keyframes blinkRec { 0%, 100% { opacity:1; } 50% { opacity:0.3; } }

        /* Painel Lateral do Diretor (10 Cenas e Gravador) */
        #director-panel {
            width:420px;
            height:800px;
            background:rgba(20, 23, 34, 0.95);
            border:1px solid rgba(0, 247, 255, 0.3);
            border-radius:24px;
            padding:22px;
            display:flex;
            flex-direction:column;
            gap:14px;
            box-shadow:0 15px 50px rgba(0,0,0,0.7);
            overflow-y:auto;
        }

        .panel-header { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px; }
        .panel-title { font-size:1.1rem; font-weight:900; color:#00f7ff; }

        .scene-list { display:flex; flex-direction:column; gap:8px; flex:1; overflow-y:auto; padding-right:4px; }
        .scene-card {
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:12px;
            padding:10px 14px;
            cursor:pointer;
            transition:all 0.2s ease;
            display:flex;
            align-items:center;
            justify-content:space-between;
        }
        .scene-card:hover { background:rgba(0, 247, 255, 0.12); border-color:#00f7ff; }
        .scene-card.active { background:rgba(0, 247, 255, 0.25); border-color:#00f7ff; box-shadow:0 0 15px rgba(0, 247, 255, 0.3); }
        .scene-info { display:flex; flex-direction:column; gap:2px; }
        .scene-title { font-size:0.85rem; font-weight:800; color:#ffd000; }
        .scene-desc { font-size:0.72rem; color:#cbd5e1; }
        .scene-num { font-size:0.78rem; font-weight:900; color:#00f7ff; font-family:monospace; }

        /* Botões de Ação do Gravador */
        .director-actions { display:flex; flex-direction:column; gap:10px; border-top:1px solid rgba(255,255,255,0.1); padding-top:14px; }
        .btn-record-one {
            padding:14px;
            border-radius:14px;
            background:linear-gradient(90deg, #e11d48, #be123c);
            border:none;
            color:#fff;
            font-size:0.95rem;
            font-weight:900;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            box-shadow:0 6px 20px rgba(225,29,72,0.4);
        }
        .btn-record-all {
            padding:14px;
            border-radius:14px;
            background:linear-gradient(90deg, #10b981, #059669);
            border:none;
            color:#fff;
            font-size:0.95rem;
            font-weight:900;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            box-shadow:0 6px 20px rgba(16,185,129,0.4);
        }
        .btn-record-one:hover, .btn-record-all:hover { filter:brightness(1.1); transform:scale(1.02); }
        .btn-record-one:disabled, .btn-record-all:disabled { opacity:0.5; pointer-events:none; }

        .progress-box { font-size:0.78rem; text-align:center; color:#00f7ff; font-weight:700; min-height:18px; }
    </style>
</head>
<body>

    <div id="studio-container">
        
        <!-- Viewport do Smartphone Instagram 9:16 -->
        <div id="phone-frame">
            <canvas id="studio-canvas"></canvas>

            <div id="rec-indicator">🔴 GRAVANDO REEL... <span id="rec-timer">0s</span></div>

            <div class="reel-overlay">
                <div class="reel-top-bar">
                    <div class="reel-author">
                        <div class="reel-avatar"><div class="reel-avatar-in">🏎️</div></div>
                        <div>
                            <div class="reel-name">roadsterdash3d</div>
                            <div class="reel-badge">Áudio original • Em alta</div>
                        </div>
                    </div>
                    <div style="font-size:1.2rem;">🎵</div>
                </div>

                <div class="reel-hook-card" id="hook-card">
                    <div class="reel-hook-title" id="hook-title">⚡ SUBWAY SURFERS RUSH!</div>
                    <div class="reel-hook-sub" id="hook-sub">Desvios insanos a 200 KM/H</div>
                </div>

                <div class="reel-bottom-cta">
                    <div class="cta-pill" id="cta-text">🔥 JOGUE GRÁTIS NO LINK DA BIO ➔</div>
                    <div class="cta-caption">Disponível para celular e PC • Sem download</div>
                </div>
            </div>
        </div>

        <!-- Painel de Seleção das 10 Cenas & Gravador Automático -->
        <div id="director-panel">
            <div class="panel-header">
                <span class="panel-title">🎬 ESTÚDIO DE VÍDEOS (10 CENAS)</span>
                <span style="font-size:0.75rem; color:#94a3b8;">Instagram Reels / Stories</span>
            </div>

            <div class="scene-list" id="scene-list-container">
                <!-- Inserido dinamicamente via JS -->
            </div>

            <div class="progress-box" id="studio-status">Pronto para gravar em MP4 / WebM</div>

            <div class="director-actions">
                <button class="btn-record-one" id="btn-record-current">
                    🎥 GRAVAR ESTE VÍDEO (REEL 6s)
                </button>
                <button class="btn-record-all" id="btn-record-all">
                    🚀 GRAVAR TODOS OS 10 VÍDEOS EM LOTE
                </button>
            </div>
        </div>

    </div>

    <!-- Script de Construção Three.js & Gravador -->
    <script>
        // =====================================================================
        // DEFINIÇÃO DAS 10 CENAS CINEMATOGRÁFICAS PARA O INSTAGRAM
        // =====================================================================
        const SCENES = [
            {
                id: 1,
                title: "01. Subway Surfers Rush",
                desc: "Desvios rápidos em zigue-zague entre 3 faixas com inclinação viva",
                hookTitle: "🔥 DESVIE SE FOR CAPAZ!",
                hookSub: "Zigue-zague insano no trânsito pesado",
                cta: "JOGUE GRÁTIS NO NAVEGADOR ➔",
                duration: 6.0,
                setup: (world) => {
                    world.setMode('rush');
                    world.cameraOffset = { x: 0, y: 5.6, z: 8.8, lookY: 1.6 };
                    world.env.setSunIntensity(2.2);
                    world.env.setSunColor(0xffbe85);
                    world.car.shieldMesh.visible = false;
                }
            },
            {
                id: 2,
                title: "02. Salto 360° na Rampa",
                desc: "Aproximação de rampa em cunha e voo com Barrel Roll completo",
                hookTitle: "🛹 SALTO 360° NA RAMPA!",
                hookSub: "Manobra aérea sobre o trânsito",
                cta: "BATA MEU RECORDE AGORA ➔",
                duration: 6.0,
                setup: (world) => {
                    world.setMode('ramp_jump');
                    world.cameraOffset = { x: 0, y: 5.2, z: 9.2, lookY: 2.2 };
                    world.env.setSunIntensity(2.5);
                    world.car.shieldMesh.visible = false;
                }
            },
            {
                id: 3,
                title: "03. Modo Escudo Destruidor",
                desc: "Bolha hexagonal ciano ativa, destruindo múltiplos carros na pista",
                hookTitle: "🛡️ MODO ESCUDO INVENCÍVEL!",
                hookSub: "Esmagando tudo pelo caminho",
                cta: "DESBLOQUEIE SUPERCARROS ➔",
                duration: 6.0,
                setup: (world) => {
                    world.setMode('shield_rampage');
                    world.cameraOffset = { x: 0, y: 4.8, z: 8.0, lookY: 1.5 };
                    world.car.shieldMesh.visible = true;
                    world.car.shieldMesh.material.opacity = 0.65;
                }
            },
            {
                id: 4,
                title: "04. Close nos 4 Escapes de Fogo",
                desc: "Câmera rasante na traseira focada nos 4 bocais de titânio pulsando fogo",
                hookTitle: "💨 4 ESCAPES DE FOGUETE!",
                hookSub: "Motor hiperdrive em potência máxima",
                cta: "OUÇA O RONCO DO MOTOR ➔",
                duration: 6.0,
                setup: (world) => {
                    world.setMode('thruster_cam');
                    world.cameraOffset = { x: 0, y: 2.3, z: 5.6, lookY: 1.1 };
                    world.env.setSunIntensity(2.8);
                    world.car.shieldMesh.visible = false;
                }
            },
            {
                id: 5,
                title: "05. Sunset Highway Dourada",
                desc: "Câmera ampla valorizando o sol poente gigante e a pintura dourada",
                hookTitle: "🌅 SUNSET BRIDGE RETRO 80s",
                hookSub: "O visual mais relaxante e veloz",
                cta: "JOGUE ONLINE DIRETO NO LINK ➔",
                duration: 6.0,
                setup: (world) => {
                    world.setMode('sunset_cruise');
                    world.cameraOffset = { x: 1.8, y: 6.2, z: 10.5, lookY: 2.0 };
                    world.env.setSunIntensity(3.0);
                    world.env.setSunColor(0xffaa33);
                    world.car.shieldMesh.visible = false;
                }
            },
            {
                id: 6,
                title: "06. Noite Neon Cyberpunk",
                desc: "Céu noturno violeta, asfalto escuro e iluminação neon ciano e magenta",
                hookTitle: "⚡ NOITE CYBERPUNK NEON",
                hookSub: "Luzes neon acesas na metrópole",
                cta: "CORRA NA PISTA NOTURNA ➔",
                duration: 6.0,
                setup: (world) => {
                    world.setMode('night_neon');
                    world.cameraOffset = { x: 0, y: 5.4, z: 8.8, lookY: 1.6 };
                    world.env.setSunIntensity(0.8);
                    world.env.setSunColor(0x00e5ff);
                    world.env.scene.background.set(0x130a24);
                    world.car.shieldMesh.visible = false;
                }
            },
            {
                id: 7,
                title: "07. Chuva de Moedas Douradas",
                desc: "Trilhas de moedas 3D girando e sendo sugadas para o contador",
                hookTitle: "🪙 CAÇADOR DE MOEDAS!",
                hookSub: "Coletando fortuna para novos supercarros",
                cta: "GARANTA 1.500 MOEDAS HOJE ➔",
                duration: 6.0,
                setup: (world) => {
                    world.setMode('coin_rush');
                    world.cameraOffset = { x: 0, y: 5.6, z: 8.8, lookY: 1.6 };
                    world.car.shieldMesh.visible = false;
                }
            },
            {
                id: 8,
                title: "08. Câmera Invertida Frontal",
                desc: "Câmera olhando para a grade do carro com o tráfego passando rente",
                hookTitle: "👀 CÂMERA DE AÇÃO FRONTAL",
                hookSub: "Sentindo a velocidade na pele",
                cta: "TESTE SEUS REFLEXOS ➔",
                duration: 6.0,
                setup: (world) => {
                    world.setMode('reverse_cam');
                    world.cameraOffset = { x: 0, y: 2.4, z: -6.5, lookY: 1.0 };
                    world.car.shieldMesh.visible = false;
                }
            },
            {
                id: 9,
                title: "09. Near Miss Raspando Carros",
                desc: "Ultrapassagens milimétricas entre dois caminhões pesados com faíscas",
                hookTitle: "😱 POR UM MILÍMETRO!",
                hookSub: "Ultrapassagem no limite extremo",
                cta: "PROVE QUE VOCÊ É PILOTO PRO ➔",
                duration: 6.0,
                setup: (world) => {
                    world.setMode('near_miss');
                    world.cameraOffset = { x: 0, y: 5.0, z: 7.8, lookY: 1.5 };
                    world.car.shieldMesh.visible = false;
                }
            },
            {
                id: 10,
                title: "10. Hyperdrive Nitro Boost",
                desc: "Aceleração máxima extrema com FOV aberto e clímax de conversão",
                hookTitle: "🚀 VELOCIDADE DA LUZ: 300 KM/H!",
                hookSub: "O jogo de corrida do momento",
                cta: "CLIQUE E JOGUE AGORA MESMO ➔",
                duration: 6.0,
                setup: (world) => {
                    world.setMode('hyperdrive');
                    world.cameraOffset = { x: 0, y: 4.8, z: 7.5, lookY: 1.5 };
                    world.car.shieldMesh.visible = false;
                }
            }
        ];

        // =====================================================================
        // MOTOR 3D SOLARIS HYPERCAR & SUNSET BRIDGE
        // =====================================================================
        const LANES = [-3.8, 0.0, 3.8];

        class StudioWorld {
            constructor(canvas) {
                this.canvas = canvas;
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(68, 390 / 800, 0.1, 700);
                this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
                this.renderer.setSize(390, 800);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

                this.mode = 'rush';
                this.timeInScene = 0;
                this.cameraOffset = { x: 0, y: 5.6, z: 8.8, lookY: 1.6 };

                this.carX = 0;
                this.carY = 0;
                this.carRoll = 0;
                this.speed = 52.0;

                this.initEnv();
                this.initCar();
                this.initProps();
            }

            initEnv() {
                const HORIZON = 0xf2a07e;
                this.scene.background = new THREE.Color(HORIZON);
                this.scene.fog = new THREE.FogExp2(HORIZON, 0.0055);

                this.sunLight = new THREE.DirectionalLight(0xffbe85, 2.2);
                this.sunLight.position.set(-35, 26, -130);
                this.sunLight.castShadow = true;
                this.scene.add(this.sunLight);

                this.ambientLight = new THREE.AmbientLight(0xd18ca7, 0.9);
                this.scene.add(this.ambientLight);

                this.env = {
                    scene: this.scene,
                    setSunIntensity: (v) => this.sunLight.intensity = v,
                    setSunColor: (hex) => this.sunLight.color.set(hex)
                };

                // Sol poente gigante
                const sun = new THREE.Mesh(new THREE.CircleGeometry(45, 40), new THREE.MeshBasicMaterial({ color: 0xffde59, fog: false }));
                sun.position.set(-35, 24, -280);
                this.scene.add(sun);

                // Rodovia infinita
                this.roadSegments = [];
                const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x22242a, roughness: 0.75, metalness: 0.25 });
                const neonStripMat = new THREE.MeshBasicMaterial({ color: 0x00f7ff });
                const dashMat = new THREE.MeshBasicMaterial({ color: 0xffe600 });
                const railMat = new THREE.MeshStandardMaterial({ color: 0x3e4450, roughness: 0.35, metalness: 0.8 });

                for (let i = 0; i < 12; i++) {
                    const seg = new THREE.Group();
                    const road = new THREE.Mesh(new THREE.BoxGeometry(14.5, 0.4, 40), asphaltMat);
                    road.position.y = -0.2; road.receiveShadow = true;
                    seg.add(road);

                    [-1.9, 1.9].forEach(lx => {
                        for (let d = -17; d < 17; d += 8) {
                            const dash = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.02, 3.8), dashMat);
                            dash.position.set(lx, 0.02, d);
                            seg.add(dash);
                        }
                    });

                    [-7.25, 7.25].forEach((gx, idx) => {
                        const rail = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.8, 40), railMat);
                        rail.position.set(gx, 0.35, 0);
                        seg.add(rail);
                        const neon = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 40), neonStripMat);
                        neon.position.set(gx + (idx === 0 ? 0.25 : -0.25), 0.72, 0);
                        seg.add(neon);
                    });

                    seg.position.z = -i * 40 + 20;
                    this.scene.add(seg);
                    this.roadSegments.push(seg);
                }
            }

            initCar() {
                this.carGroup = new THREE.Group();
                const gold = new THREE.MeshStandardMaterial({ color: 0xf0b030, roughness: 0.24, metalness: 0.65 });
                const carbon = new THREE.MeshStandardMaterial({ color: 0x16171b, roughness: 0.45, metalness: 0.4 });
                const glass = new THREE.MeshStandardMaterial({ color: 0x0c0e14, roughness: 0.08, metalness: 0.85 });
                const orange = new THREE.MeshBasicMaterial({ color: 0xff6a00 });
                const tire = new THREE.MeshStandardMaterial({ color: 0x121318, roughness: 0.85 });
                const rim = new THREE.MeshStandardMaterial({ color: 0xf0b030, metalness: 0.8 });

                // Corpo do Solaris Hypercar
                const bodyShape = new THREE.Shape();
                const pts = [[-2.55, 0.26], [2.3, 0.26], [2.45, 0.36], [2.25, 0.46], [0.9, 0.64], [-0.4, 0.8], [-2.2, 0.66], [-2.55, 0.52]];
                bodyShape.moveTo(pts[0][0], pts[0][1]);
                for (let i = 1; i < pts.length; i++) bodyShape.lineTo(pts[i][0], pts[i][1]);
                bodyShape.closePath();
                const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, { depth: 2.15, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.06 });
                bodyGeo.translate(0, 0, -1.07); bodyGeo.rotateY(Math.PI / 2);
                const bodyMesh = new THREE.Mesh(bodyGeo, gold); bodyMesh.castShadow = true;
                this.carGroup.add(bodyMesh);

                // Cockpit
                const glassMesh = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.4, 1.8), glass);
                glassMesh.position.set(0, 0.82, -0.3);
                this.carGroup.add(glassMesh);

                // Barbatana dorsal central
                const fin = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.45, 1.9), carbon);
                fin.position.set(0, 0.95, 0.8);
                this.carGroup.add(fin);

                // Lanterna contínua neon
                const taillight = new THREE.Mesh(new THREE.BoxGeometry(2.02, 0.05, 0.06), orange);
                taillight.position.set(0, 0.6, 2.53);
                this.carGroup.add(taillight);

                // 4 Escapes de Foguete com Chamas
                this.flames = [];
                const c = document.createElement('canvas'); c.width = c.height = 64;
                const g = c.getContext('2d');
                const gr = g.createRadialGradient(32,32,0,32,32,32);
                gr.addColorStop(0,'#fff'); gr.addColorStop(0.4,'#ff9900'); gr.addColorStop(1,'transparent');
                g.fillStyle = gr; g.fillRect(0,0,64,64);
                const flameTex = new THREE.CanvasTexture(c);

                [-0.45, -0.17, 0.17, 0.45].forEach(x => {
                    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.22, 16).rotateX(Math.PI / 2), carbon);
                    pipe.position.set(x, 0.4, 2.58);
                    this.carGroup.add(pipe);

                    const flame = new THREE.Sprite(new THREE.SpriteMaterial({ map: flameTex, color: 0xff9922, blending: THREE.AdditiveBlending }));
                    flame.position.set(x, 0.4, 2.76);
                    flame.scale.set(0.65, 0.65, 1);
                    this.carGroup.add(flame);
                    this.flames.push(flame);
                });

                // Rodas
                this.wheels = [];
                [[-1.05, 0.42, -1.4], [1.05, 0.42, -1.4], [-1.05, 0.42, 1.45], [1.05, 0.42, 1.45]].forEach(([wx, wy, wz]) => {
                    const wGroup = new THREE.Group();
                    wGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.34, 18).rotateZ(Math.PI / 2), tire));
                    wGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.35, 14).rotateZ(Math.PI / 2), rim));
                    wGroup.position.set(wx, wy, wz);
                    this.carGroup.add(wGroup);
                    this.wheels.push(wGroup);
                });

                // Escudo Protetor
                const sGeo = new THREE.SphereGeometry(2.35, 24, 18);
                sGeo.scale(1.0, 0.72, 1.35);
                this.shieldMesh = new THREE.Mesh(sGeo, new THREE.MeshStandardMaterial({
                    color: 0x00f7ff, emissive: 0x00d4ff, emissiveIntensity: 0.9, transparent: true, opacity: 0.0,
                    roughness: 0.1, wireframe: true, blending: THREE.AdditiveBlending
                }));
                this.shieldMesh.position.set(0, 0.65, 0.1);
                this.shieldMesh.visible = false;
                this.carGroup.add(this.shieldMesh);

                this.scene.add(this.carGroup);
                this.car = this;
            }

            initProps() {
                this.trafficCars = [];
                this.props = [];

                // Carros do Tráfego para Cenas
                for (let i = 0; i < 4; i++) {
                    const obs = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.1, 4.2), new THREE.MeshStandardMaterial({ color: 0xd63031, metalness: 0.5 }));
                    obs.position.set(LANES[i % 3], 0.55, -40 - (i * 35));
                    this.scene.add(obs);
                    this.trafficCars.push(obs);
                }

                // Rampa Amarela
                const rGeo = new THREE.BoxGeometry(2.6, 1.6, 7.0);
                rGeo.rotateX(Math.atan2(1.6, 7.0));
                this.ramp = new THREE.Mesh(rGeo, new THREE.MeshStandardMaterial({ color: 0x24283b, metalness: 0.4 }));
                this.ramp.position.set(0, 0.75, -50);
                this.scene.add(this.ramp);

                // Moedas Douradas
                this.coins = [];
                for (let c = 0; c < 8; c++) {
                    const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.1, 14).rotateZ(Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00 }));
                    coin.position.set(0, 1.0, -15 - (c * 5));
                    this.scene.add(coin);
                    this.coins.push(coin);
                }
            }

            setMode(mode) {
                this.mode = mode;
                this.timeInScene = 0;
                this.carY = 0;
                this.carRoll = 0;
                this.ramp.position.set(0, 0.75, -50);
                this.trafficCars.forEach((tc, idx) => {
                    tc.position.set(LANES[(idx + 1) % 3], 0.55, -30 - (idx * 32));
                    tc.visible = true;
                });
            }

            update(delta) {
                this.timeInScene += delta;
                const t = this.timeInScene;

                // Animação das Chamas
                this.flames.forEach(f => f.scale.set(0.65 + Math.random() * 0.15, 0.65 + Math.random() * 0.15, 1));
                this.wheels.forEach(w => w.rotation.x -= delta * 35);

                // Rodovia infinita
                this.roadSegments.forEach(s => {
                    s.position.z += this.speed * delta;
                    if (s.position.z > 40) s.position.z -= 480;
                });

                // COREOGRAFIA DINÂMICA CONFORME A CENA SELECIONADA
                switch (this.mode) {
                    case 'rush': // 01. Subway Surfers Zigue-Zague
                        this.carX = Math.sin(t * 3.2) * 3.8;
                        this.carRoll = -Math.cos(t * 3.2) * 0.18;
                        this.trafficCars.forEach(tc => tc.position.z += 18 * delta);
                        break;

                    case 'ramp_jump': // 02. Salto 360 na Rampa
                        this.ramp.position.z += this.speed * delta;
                        if (this.ramp.position.z > -10 && this.ramp.position.z < 25) {
                            this.carY = Math.sin((this.ramp.position.z + 10) / 35 * Math.PI) * 5.2;
                            this.carRoll += delta * Math.PI * 2.2;
                        } else {
                            this.carY = 0; this.carRoll = 0;
                        }
                        break;

                    case 'shield_rampage': // 03. Destruição com Escudo
                        this.carX = 0;
                        this.trafficCars.forEach((tc, idx) => {
                            tc.position.z += 15 * delta;
                            if (Math.abs(tc.position.z - this.carGroup.position.z) < 3.5) {
                                tc.position.y += 18 * delta;
                                tc.position.x += (idx % 2 === 0 ? 1 : -1) * 22 * delta;
                                tc.rotation.x += delta * 12;
                            }
                        });
                        break;

                    case 'thruster_cam': // 04. Escapes de Fogo
                        this.carX = Math.sin(t * 1.5) * 1.2;
                        this.carRoll = -Math.cos(t * 1.5) * 0.08;
                        break;

                    case 'sunset_cruise': // 05. Sunset Dourado
                        this.carX = LANES[1];
                        break;

                    case 'night_neon': // 06. Noite Neon
                        this.carX = Math.sin(t * 2.0) * 2.5;
                        break;

                    case 'coin_rush': // 07. Chuva de Moedas
                        this.carX = LANES[1];
                        this.coins.forEach(c => {
                            c.position.z += this.speed * delta;
                            c.rotation.y += delta * 4;
                            if (c.position.z > 15) c.position.z -= 40;
                        });
                        break;

                    case 'reverse_cam': // 08. Câmera Invertida Frontal
                        this.carX = Math.sin(t * 2.5) * 2.8;
                        break;

                    case 'near_miss': // 09. Ultrapassagem no Milímetro
                        this.carX = Math.sin(t * 4.0) * 1.8;
                        break;

                    case 'hyperdrive': // 10. Hyperdrive Nitro
                        this.speed = 85.0;
                        this.camera.fov = 82 + Math.sin(t * 6) * 4;
                        this.camera.updateProjectionMatrix();
                        break;
                }

                // Posicionamento do Carro
                this.carGroup.position.x = this.carX;
                this.carGroup.position.y = this.carY;
                this.carGroup.rotation.z = this.carRoll;

                // Câmera dinâmica de perseguição
                if (this.mode === 'reverse_cam') {
                    this.camera.position.set(this.carX * 0.5, this.cameraOffset.y, this.cameraOffset.z);
                    this.camera.lookAt(this.carX, 0.8, 12);
                } else {
                    this.camera.position.set(this.carX * 0.35 + this.cameraOffset.x, this.carY + this.cameraOffset.y, this.cameraOffset.z);
                    this.camera.lookAt(this.carX * 0.15, this.carY + this.cameraOffset.lookY, -12);
                }

                this.renderer.render(this.scene, this.camera);
            }
        }

        // =====================================================================
        // CONTROLE DA INTERFACE DO DIRETOR E GRAVADOR MEDIARECORDER MP4/WEBM
        // =====================================================================
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('studio-canvas');
            const world = new StudioWorld(canvas);

            let currentSceneIndex = 0;
            let isRecording = false;
            let mediaRecorder = null;
            let recordedChunks = [];

            // Popula lista de cenas
            const listContainer = document.getElementById('scene-list-container');
            SCENES.forEach((sc, idx) => {
                const card = document.createElement('div');
                card.className = `scene-card ${idx === 0 ? 'active' : ''}`;
                card.innerHTML = `
                    <div class="scene-info">
                        <span class="scene-title">${sc.title}</span>
                        <span class="scene-desc">${sc.desc}</span>
                    </div>
                    <span class="scene-num">${sc.duration}s</span>
                `;
                card.addEventListener('click', () => loadScene(idx));
                listContainer.appendChild(card);
            });

            function loadScene(idx) {
                currentSceneIndex = idx;
                const sc = SCENES[idx];

                // Atualiza cards
                document.querySelectorAll('.scene-card').forEach((c, i) => {
                    c.classList.toggle('active', i === idx);
                });

                // Atualiza overlays de vídeo
                document.getElementById('hook-title').textContent = sc.hookTitle;
                document.getElementById('hook-sub').textContent = sc.hookSub;
                document.getElementById('cta-text').textContent = sc.cta;

                sc.setup(world);
                document.getElementById('studio-status').textContent = `Cena ativa: ${sc.title}`;
            }

            // Inicia na cena 01
            loadScene(0);

            // Gravador com MediaRecorder API (60 FPS Nativos)
            async function recordScene(sceneIdx) {
                return new Promise((resolve) => {
                    const sc = SCENES[sceneIdx];
                    loadScene(sceneIdx);

                    const stream = canvas.captureStream(60);
                    const mime = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1') ? 'video/mp4;codecs=avc1' :
                                 MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
                    
                    recordedChunks = [];
                    mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });

                    const recInd = document.getElementById('rec-indicator');
                    const recTimer = document.getElementById('rec-timer');
                    recInd.style.display = 'flex';

                    let elapsed = 0;
                    const timerInterval = setInterval(() => {
                        elapsed += 0.5;
                        recTimer.textContent = `${elapsed.toFixed(1)}s`;
                    }, 500);

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) recordedChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        clearInterval(timerInterval);
                        recInd.style.display = 'none';

                        const ext = mime.includes('mp4') ? 'mp4' : 'webm';
                        const blob = new Blob(recordedChunks, { type: mime });
                        const url = URL.createObjectURL(blob);

                        // Download automático do vídeo pronto para Instagram
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `InstagramReel_${sc.id.toString().padStart(2, '0')}_${sc.title.replace(/[^a-zA-Z0-9]/g, '_')}.${ext}`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);

                        resolve();
                    };

                    mediaRecorder.start();
                    setTimeout(() => {
                        mediaRecorder.stop();
                    }, sc.duration * 1000);
                });
            }

            // Botão Gravar Cena Atual
            document.getElementById('btn-record-current').addEventListener('click', async () => {
                const btn1 = document.getElementById('btn-record-current');
                const btnAll = document.getElementById('btn-record-all');
                btn1.disabled = true; btnAll.disabled = true;
                document.getElementById('studio-status').textContent = 'Gravando vídeo para Instagram Reels...';

                await recordScene(currentSceneIndex);

                btn1.disabled = false; btnAll.disabled = false;
                document.getElementById('studio-status').textContent = '✅ Vídeo baixado com sucesso!';
            });

            // Botão Gravar Todos os 10 Vídeos em Lote
            document.getElementById('btn-record-all').addEventListener('click', async () => {
                const btn1 = document.getElementById('btn-record-current');
                const btnAll = document.getElementById('btn-record-all');
                btn1.disabled = true; btnAll.disabled = true;

                for (let i = 0; i < SCENES.length; i++) {
                    document.getElementById('studio-status').textContent = `Gravando vídeo ${i + 1} de 10 (${SCENES[i].title})...`;
                    await recordScene(i);
                    await new Promise(r => setTimeout(r, 600)); // Pequena pausa entre downloads
                }

                btn1.disabled = false; btnAll.disabled = false;
                document.getElementById('studio-status').textContent = '🎉 Todos os 10 vídeos gravados e salvos com sucesso!';
            });

            // Loop de Renderização 60 FPS
            let lastTime = performance.now();
            function loop(time) {
                const delta = Math.min((time - lastTime) / 1000, 0.05);
                lastTime = time;
                world.update(delta);
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        });
    </script>
